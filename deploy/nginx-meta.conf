# ============================================================
# XenosMeta — meta.oxth.com
# 放到服务器: /etc/nginx/conf.d/meta.conf
# 然后: sudo nginx -t && sudo nginx -s reload
# ============================================================

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name meta.oxth.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主站点
server {
    listen 443 ssl http2;
    server_name meta.oxth.com;

    # SSL 证书（与 asr-web 共用）
    ssl_certificate     /etc/nginx/ssl/www.oxth.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.oxth.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 上传大小限制
    client_max_body_size 100m;

    # ===== 后端 API =====
    location /api {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== WebSocket (Agent 语音/实时通信) =====
    location /ws {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== 前端 Next.js =====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
